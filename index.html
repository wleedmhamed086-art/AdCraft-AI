<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' 
      xmlns:b='http://www.google.com/2005/gml/b' 
      xmlns:data='http://www.google.com/2005/gml/data' 
      xmlns:expr='http://www.google.com/2005/gml/expr' 
      lang='ar' dir='rtl'>
<head>
  <meta charset='UTF-8'/>
  <meta content='width=device-width, initial-scale=1.0' name='viewport'/>
  <title><data:blog.title/></title>
  
  <!-- Supabase JS Client -->
  <script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
  
  <!-- PayPal SDK (استبدل YOUR_PAYPAL_CLIENT_ID بمعرف حسابك في PayPal) -->
  <script src='https://www.paypal.com/sdk/js?client-id=BAAFWWpIY4D_hK1yAEucAl284olw7jeiFzk3b5egoUqs-RSZxqRLMSL3YUgwrXAizBw32umAfVhgPFkrmE&amp;currency=USD'></script>

  <!-- وسم b:skin الإجباري لبلوجر محمي بـ CDATA -->
  <b:skin><![CDATA[
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 20px; }

    .container { max-width: 900px; margin: 0 auto; }
    
    header {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      padding: 15px 25px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .credits-badge {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid var(--accent-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      margin-bottom: 25px;
    }

    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9em; }
    
    input, textarea, select {
      width: 100%;
      padding: 12px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 1rem;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s ease;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { background: #475569; cursor: not-allowed; }

    .result-box {
      margin-top: 20px;
      white-space: pre-wrap;
      background: rgba(15, 23, 42, 0.8);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      position: relative;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8em;
    }

    .ad-slot {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--border-color);
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      border-radius: 12px;
      margin: 20px 0;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      max-width: 450px;
      width: 90%;
    }
  ]]></b:skin>
</head>
<body>

  <div class='container'>
    <header>
      <h2>⚡ مولد الإعلانات الذكي</h2>
      
      <!-- قسم زائر غير مسجل -->
      <div id='auth-logged-out' style='display: none;'>
        <button onclick="openAuthModal('login')" style='padding: 8px 16px; border-radius: 8px; cursor: pointer; background: var(--accent-color); color: white; border: none; font-weight: bold;'>تسجيل الدخول</button>
      </div>

      <!-- قسم مستخدم مسجل دخول -->
      <div id='auth-logged-in' style='display: none; align-items: center; gap: 10px;'>
        <span class='credits-badge'>النقاط: <span id='credits-count'>0</span></span>
        <button onclick='openChargeModal()' style='padding: 6px 12px; border-radius: 8px; cursor: pointer;'>شحن</button>
        <span id='user-email-display' style='font-size: 0.85em; color: var(--text-muted);'></span>
        <button onclick='handleLogout()' style='padding: 6px 12px; border-radius: 8px; cursor: pointer; background: #ef4444; color: white; border: none;'>خروج</button>
      </div>
    </header>

    <!-- إعلان علوي -->
    <div class='ad-slot'>مساحة إعلانية (AdSlot Top)</div>

    <main class='glass-card'>
      <form id='ad-form'>
        <div class='form-group'>
          <label for='productName'>اسم المنتج أو الخدمة</label>
          <input id='productName' placeholder='مثال: تطبيق تنظيم الوقت' required='required' type='text'/>
        </div>

        <div class='form-group'>
          <label for='productDesc'>تفاصيل ومميزات المنتج</label>
          <textarea id='productDesc' placeholder='اكتب أهم الفوائد والمميزات...' required='required' rows='4'></textarea>
        </div>

        <div style='display: flex; gap: 15px;'>
          <div class='form-group' style='flex: 1;'>
            <label for='tone'>نغمة الخطاب</label>
            <select id='tone'>
              <option value='حماسية وجذابة'>حماسية وجذابة</option>
              <option value='احترافية ورسمية'>احترافية ورسمية</option>
              <option value='وديّة وفكاهية'>وديّة وفكاهية</option>
            </select>
          </div>

          <div class='form-group' style='flex: 1;'>
            <label for='platform'>المنصة الإعلانية</label>
            <select id='platform'>
              <option value='Facebook'>فيسبوك (Facebook)</option>
              <option value='Instagram'>إنستغرام (Instagram)</option>
              <option value='TikTok'>تيك توك (TikTok)</option>
              <option value='Google Ads'>إعلانات جوجل</option>
            </select>
          </div>
        </div>

        <button class='btn' id='submit-btn' type='submit'>توليد النص الإعلاني (1 نقطة)</button>
      </form>

      <div id='result-container' style='display: none;'>
        <div class='result-box'>
          <button class='copy-btn' onclick='copyResult()'>نسخ النص 📋</button>
          <div id='result-text'></div>
        </div>
      </div>
    </main>

    <!-- إعلان سفلي -->
    <div class='ad-slot'>مساحة إعلانية (AdSlot Bottom)</div>

    <!-- قسم إجباري لبلوجر -->
    <b:section id='main' showaddelement='yes'/>
  </div>

  <!-- Modal شحن النقاط -->
  <div class='modal' id='charge-modal'>
    <div class='modal-content'>
      <h3 style='margin-bottom: 15px;'>شحن رصيد النقاط</h3>
      <p style='margin-bottom: 20px; color: var(--text-muted);'>باقة 10 نقاط بـ $4.99 دولار</p>
      <div id='paypal-button-container'></div>
      <button onclick='closeChargeModal()' style='margin-top: 15px; width: 100%; padding: 10px; background: transparent; color: var(--text-muted); border: none; cursor: pointer;'>إلغاء</button>
    </div>
  </div>

  <!-- Modal تسجيل الدخول وإنشاء الحساب -->
  <div class='modal' id='auth-modal'>
    <div class='modal-content'>
      <h3 id='auth-title' style='margin-bottom: 20px;'>تسجيل الدخول</h3>
      
      <form id='auth-form'>
        <div class='form-group'>
          <label for='auth-email'>البريد الإلكتروني</label>
          <input id='auth-email' required='required' type='email' placeholder='name@example.com'/>
        </div>
        
        <div class='form-group'>
          <label for='auth-password'>كلمة المرور</label>
          <input id='auth-password' required='required' type='password' placeholder='••••••••'/>
        </div>

        <button class='btn' id='auth-submit-btn' type='submit'>دخول</button>
      </form>

      <div style='margin-top: 15px; text-align: center; font-size: 0.9em; color: var(--text-muted);'>
        <span id='auth-toggle-text'>ليس لديك حساب؟</span> 
        <a href='javascript:void(0)' id='auth-toggle-link' onclick='toggleAuthMode()' style='color: var(--accent-color); font-weight: bold; text-decoration: none;'>إنشاء حساب جديد</a>
      </div>

      <button onclick='closeAuthModal()' style='margin-top: 15px; width: 100%; padding: 10px; background: transparent; color: var(--text-muted); border: none; cursor: pointer;'>إلغاء</button>
    </div>
  </div>

  <script type='text/javascript'>
    /* <![CDATA[ */
    // 1. الإعدادات والمفاتيح
    const SUPABASE_URL = "https://your-project-id.supabase.co"; // ضع رابط مشروعك الخاص بـ Supabase هنا
    const SUPABASE_ANON_KEY = "sb_publishable__PgAtBzZ1GXO8b-gEZiicw_btfZfauG"; // المفتاح العلني الخاص بك
    const API_BASE_URL = "https://ad-craft-ai-phi.vercel.app/api"; // رابط خادم Vercel المباشر

    const supabase = supabasejs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentAuthMode = 'login';

    // 2. إدارة جلسة المستخدم (Auth Listener)
    supabase.auth.onAuthStateChange((event, session) => {
      const loggedOutDiv = document.getElementById('auth-logged-out');
      const loggedInDiv = document.getElementById('auth-logged-in');

      if (session) {
        loggedOutDiv.style.display = 'none';
        loggedInDiv.style.display = 'flex';
        document.getElementById('user-email-display').innerText = session.user.email;
        fetchUserProfile(session);
      } else {
        loggedOutDiv.style.display = 'block';
        loggedInDiv.style.display = 'none';
        document.getElementById('credits-count').innerText = '0';
      }
    });

    async function fetchUserProfile(session) {
      const { data } = await supabase
        .from('profiles')
        .select('credits_left')
        .eq('id', session.user.id)
        .single();

      if (data) {
        document.getElementById('credits-count').innerText = data.credits_left;
      }
    }

    // 3. إدارة نافذة تسجيل الدخول/التسجيل (Modal)
    function openAuthModal(mode = 'login') {
      currentAuthMode = mode;
      updateAuthModalUI();
      document.getElementById('auth-modal').style.display = 'flex';
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').style.display = 'none';
    }

    function toggleAuthMode() {
      currentAuthMode = currentAuthMode === 'login' ? 'signup' : 'login';
      updateAuthModalUI();
    }

    function updateAuthModalUI() {
      const title = document.getElementById('auth-title');
      const submitBtn = document.getElementById('auth-submit-btn');
      const toggleText = document.getElementById('auth-toggle-text');
      const toggleLink = document.getElementById('auth-toggle-link');

      if (currentAuthMode === 'login') {
        title.innerText = 'تسجيل الدخول';
        submitBtn.innerText = 'دخول';
        toggleText.innerText = 'ليس لديك حساب؟';
        toggleLink.innerText = 'إنشاء حساب جديد';
      } else {
        title.innerText = 'إنشاء حساب جديد';
        submitBtn.innerText = 'تسجيل حساب جديد';
        toggleText.innerText = 'لديك حساب بالفعل؟';
        toggleLink.innerText = 'تسجيل الدخول';
      }
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const submitBtn = document.getElementById('auth-submit-btn');

      submitBtn.disabled = true;
      submitBtn.innerText = 'جاري المعالجة...';

      try {
        if (currentAuthMode === 'login') {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          closeAuthModal();
        } else {
          const { error } = await supabase.auth.signUp({ email, password });
          if (error) throw error;
          alert('✅ تم إنشاء الحساب بنجاح!');
          closeAuthModal();
        }
      } catch (err) {
        alert(`❌ خطأ: ${err.message}`);
      } finally {
        submitBtn.disabled = false;
        updateAuthModalUI();
      }
    });

    async function handleLogout() {
      const { error } = await supabase.auth.signOut();
      if (error) alert(error.message);
    }

    // 4. إرسال طلب التوليد للذكاء الاصطناعي
    const adForm = document.getElementById('ad-form');
    const submitBtn = document.getElementById('submit-btn');

    adForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        openAuthModal('login');
        alert('يرجى تسجيل الدخول أو إنشاء حساب أولاً لتوليد الإعلانات.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'جاري التوليد بالذكاء الاصطناعي... ⏳';

      try {
        const response = await fetch(`${API_BASE_URL}/generate`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({
            productName: document.getElementById('productName').value,
            productDesc: document.getElementById('productDesc').value,
            tone: document.getElementById('tone').value,
            platform: document.getElementById('platform').value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'حدث خطأ غير متوقع أثناء التوليد');
        }

        document.getElementById('result-text').innerText = data.result;
        document.getElementById('result-container').style.display = 'block';
        document.getElementById('credits-count').innerText = data.creditsLeft;

      } catch (err) {
        alert(`❌ تنبيه: ${err.message}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'توليد النص الإعلاني (1 نقطة)';
      }
    });

    // 5. دالة النسخ
    function copyResult() {
      const text = document.getElementById('result-text').innerText;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => alert('تم النسخ بنجاح!'));
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('تم النسخ بنجاح!');
      }
    }

    // 6. شحن النقاط عبر PayPal
    function openChargeModal() {
      const modal = document.getElementById('charge-modal');
      const paypalContainer = document.getElementById('paypal-button-container');
      
      paypalContainer.innerHTML = '';
      modal.style.display = 'flex';

      paypal.Buttons({
        createOrder: (data, actions) => {
          return actions.order.create({
            purchase_units: [{ amount: { value: '4.99' } }]
          });
        },
        onApprove: async (data, actions) => {
          const order = await actions.order.capture();
          const { data: { session } } = await supabase.auth.getSession();

          const res = await fetch(`${API_BASE_URL}/paypal-capture`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${session.access_token}`
            },
            body: JSON.stringify({
              orderID: order.id,
              creditsToAdd: 10
            })
          });

          const resultData = await res.json();
          if (resultData.success) {
            document.getElementById('credits-count').innerText = resultData.newCredits;
            alert('تم شحن 10 نقاط بنجاح!');
            closeChargeModal();
          }
        }
      }).render('#paypal-button-container');
    }

    function closeChargeModal() {
      document.getElementById('charge-modal').style.display = 'none';
    }
    /* ]]> */
  </script>
</body>
</html>
