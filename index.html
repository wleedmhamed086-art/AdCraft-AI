<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة إنشاء الإعلانات | Gemini Studio</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    
    .app-card { background: var(--card-bg); width: 100%; max-width: 680px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid var(--border); }
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { font-size: 24px; color: var(--primary); margin-bottom: 6px; }
    .header p { color: #64748b; font-size: 14px; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #334155; }
    input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; background: #fff; }
    input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

    .file-dropzone { border: 2px dashed var(--border); padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; background: #f8fafc; transition: 0.2s; }
    .file-dropzone:hover { border-color: var(--primary); background: #eff6ff; }
    #imagePreview { max-width: 100px; max-height: 100px; border-radius: 6px; margin-top: 10px; display: none; margin: 10px auto 0 auto; }

    .btn-main { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn-main:hover { background: var(--primary-hover); }
    .btn-main:disabled { background: #94a3b8; cursor: not-allowed; }

    .status-box { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 500; display: none; }
    .status-box.loading { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .status-box.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    .result-container { margin-top: 25px; display: none; }
    .result-title { font-weight: 700; font-size: 16px; margin-bottom: 10px; }
    .result-body { background: #f8fafc; padding: 18px; border-radius: 10px; border: 1px solid var(--border); white-space: pre-line; font-size: 14px; line-height: 1.7; color: #1e293b; max-height: 400px; overflow-y: auto; }

    .controls-row { display: flex; gap: 10px; margin-top: 12px; }
    .btn-secondary { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-play { background: #dcfce7; color: #15803d; }
    .btn-play:hover { background: #bbf7d0; }
    .btn-stop { background: #fee2e2; color: #b91c1c; }
    .btn-stop:hover { background: #fecaca; }
    .btn-copy { background: #e0f2fe; color: #0369a1; }
    .btn-copy:hover { background: #bae6fd; }

    @media (max-width: 600px) { .controls-row { flex-direction: column; } }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <h1>🎬 صانع الإعلانات المباشر</h1>
      <p>يولد سيناريو الإعلانات والتعليق الصوتي باستخدام نماذج Gemini الذكية</p>
    </div>

    <!-- تفاصيل المنتج -->
    <div class="form-group">
      <label for="productName">اسم المنتج أو الخدمة *</label>
      <input type="text" id="productName" placeholder="مثال: عطر لافندر الملكي">
    </div>

    <div class="form-group">
      <label for="productDescription">تفاصيل المنتج والمميزات</label>
      <textarea id="productDescription" rows="3" placeholder="الوصف والمزايا الأساسية للمنتج..."></textarea>
    </div>

    <!-- رفع الصورة -->
    <div class="form-group">
      <label>صورة المنتج (اختياري)</label>
      <div class="file-dropzone" onclick="document.getElementById('productImage').click()">
        <span id="uploadText">📁 اضغط هنا لرفع صورة المنتج</span>
        <input type="file" id="productImage" accept="image/*" style="display: none;" onchange="handleImage(event)">
        <img id="imagePreview" alt="معاينة الصورة">
      </div>
    </div>

    <button id="submitBtn" class="btn-main" onclick="generateAd()">🚀 إنشاء سيناريو الإعلان</button>

    <div id="statusBox" class="status-box"></div>

    <!-- النتائج -->
    <div id="resultContainer" class="result-container">
      <div class="result-title">📋 خطة الإعلان الناتجة:</div>
      <div id="resultText" class="result-body"></div>

      <div class="controls-row">
        <button class="btn-secondary btn-play" onclick="playSpeech()">🔊 استماع للتعليق الصوتي</button>
        <button class="btn-secondary btn-stop" onclick="stopSpeech()">⏹️ إيقاف الصوت</button>
        <button class="btn-secondary btn-copy" onclick="copyResult()">📋 نسخ النص</button>
      </div>
    </div>
  </div>

  <script>
    let globalImageData = null;

    function handleImage(event) {
      const file = event.target.files[0];
      const preview = document.getElementById('imagePreview');
      const uploadText = document.getElementById('uploadText');

      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        uploadText.innerText = `تم اختيار: ${file.name}`;

        const reader = new FileReader();
        reader.onload = () => {
          globalImageData = {
            mimeType: file.type,
            data: reader.result.split(',')[1]
          };
        };
        reader.readAsDataURL(file);
      }
    }

    function showStatus(message, type) {
      const box = document.getElementById('statusBox');
      box.className = `status-box ${type}`;
      box.innerText = message;
      box.style.display = 'block';
    }

    function hideStatus() {
      document.getElementById('statusBox').style.display = 'none';
    }

    async function generateAd() {
      const productName = document.getElementById('productName').value.trim();
      const productDescription = document.getElementById('productDescription').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const resultContainer = document.getElementById('resultContainer');
      const resultText = document.getElementById('resultText');

      if (!productName) { showStatus('⚠️ يرجى كتابة اسم المنتج.', 'error'); return; }

      stopSpeech();
      submitBtn.disabled = true;
      submitBtn.innerText = '⏳ جاري المعالجة...';
      showStatus('⚡ جاري الذكاء الاصطناعي لتوليد السيناريو...', 'loading');
      resultContainer.style.display = 'none';

      try {
        const promptText = `
أنت مستشار تسويقي ومخرج إعلانات محترف.
قم بإعداد خطة إعلان فيديو تسويقي متكاملة باللغة العربية بناءً على البيانات التالية:
- اسم المنتج: ${productName}
- وصف المنتج: ${productDescription || 'غير محدد'}

قم بتنسيق الإجابة بوضوح كالتالي:

[السيناريو الصوتي]
(اكتب هنا نص التعليق الصوتي المباشر والملهم الذي سيتم قراءته صوتاً)

[وصف المشاهد المرئية]
(وصف المشاهد البصرية والصور المقترحة لكل قطعة من الإعلان)

[النصوص المكتوبة على الشاشة]
(العبارات والعناوين المفتاحية التي تظهر كـ Text Overlay)
        `;

        // إرسال الطلب إلى السيرفر المحمي Vercel Serverless Function
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            promptText: promptText,
            imageData: globalImageData
          })
        });

        const data = await response.json();

        if (data.error) {
          showStatus(`❌ خطأ: ${typeof data.error === 'string' ? data.error : data.error.message}`, 'error');
        } else if (data.candidates && data.candidates[0].content) {
          hideStatus();
          resultText.innerText = data.candidates[0].content.parts[0].text;
          resultContainer.style.display = 'block';
        } else {
          showStatus('❌ تعذر الحصول على استجابة من النموذج.', 'error');
        }

      } catch (err) {
        showStatus('❌ حدث خطأ في الاتصال بالشبكة أو الخادم.', 'error');
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '🚀 إنشاء سيناريو الإعلان';
      }
    }

    function playSpeech() {
      const fullText = document.getElementById('resultText').innerText;
      if (!fullText) return;

      stopSpeech();
      const match = fullText.match(/\[السيناريو الصوتي\]([\s\S]*?)(?=\[|$)/i);
      const textToRead = match ? match[1].trim() : fullText;

      const utterance = new SpeechSynthesisUtterance(textToRead);
      utterance.lang = 'ar-SA';
      utterance.rate = 0.95;

      const voices = window.speechSynthesis.getVoices();
      const arVoice = voices.find(v => v.lang.startsWith('ar'));
      if (arVoice) utterance.voice = arVoice;

      window.speechSynthesis.speak(utterance);
    }

    function stopSpeech() {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function copyResult() {
      const text = document.getElementById('resultText').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('📋 تم نسخ سيناريو الإعلان بنجاح!');
      });
    }
  </script>
</body>
</html>
